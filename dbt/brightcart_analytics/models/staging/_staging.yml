version: 2

models:
  - name: stg_orders
    description: "Valid BrightCart orders, one row per order."
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ["COMPLETED", "CANCELLED", "PENDING", "REFUNDED"]
      - name: line_revenue_gbp
        data_tests:
          - not_null

  - name: stg_customers
    description: "Latest snapshot of each customer."
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
